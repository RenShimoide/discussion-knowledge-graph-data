<template id="app-shell">
 <header class="top"><div class="logo"><strong>JDA</strong></div><h1 id="page-title"></h1><small>単一HTML・オフライン</small><span id="dirty" class="dirty"></span><button id="reset-view">全体表示</button><button id="save-html" class="primary">編集済みHTMLを保存</button></header>
 <section class="intro"><p id="meta"></p><p>公開元とDBは変更されません。編集内容は「編集済みHTMLを保存」で手元に残せます。</p><div class="stats" id="stats"></div></section>
 <main class="layout">
  <section class="panel"><div class="panel-head"><h2>Discussion / Topic 2層グラフ</h2><div class="toolbar"><button id="zoom-out">−</button><button id="zoom-in">＋</button><button id="clear-focus">絞り込み解除</button></div></div><div class="filters">
   <div class="filter-row"><strong>検索</strong><input class="filter-control search-input" id="search-query" type="search" placeholder="発話・Topic・ユーザーを検索"><select class="filter-control" id="search-field"><option value="all">すべて</option><option value="comment">発話本文</option><option value="user">ユーザー</option><option value="topic">Topic全体</option><option value="subject">subject</option><option value="predicate">predicate</option><option value="object">object</option></select></div>
   <div class="filter-row"><strong>表示</strong><select class="filter-control" id="layer-preset"><option value="all">全レイヤー</option><option value="reply">発話・返信</option><option value="comment_topic">発話→Topic</option><option value="topic">Topic間</option><option value="comments">発話のみ</option></select><select class="filter-control" id="filter-display"><option value="hide">条件外を非表示</option><option value="dim">条件外を薄く表示</option></select><label><input id="sync-lists" type="checkbox" checked> 一覧も連動</label></div>
   <div class="filter-row"><strong>ユーザー</strong><select class="filter-control" id="user-scope"><option value="author">発話者のみ</option><option value="pair">親子を含む</option></select><div class="legend" id="user-filters"></div></div>
   <div class="filter-row"><strong>Relation</strong><div class="legend" id="relation-filters"></div></div>
   <div class="filter-row"><strong>ASR</strong><div class="legend" id="asr-filters"></div></div>
   <div class="filter-row"><strong>方向</strong><select class="filter-control" id="direction-filter"><option value="both">入出力</option><option value="out">出ていく関係</option><option value="in">入ってくる関係</option></select><span class="muted">選択中の発話・Topicを基準</span><strong>返信深さ</strong><select class="filter-control" id="depth-filter"><option value="all">すべて</option><option value="0">ルートのみ</option><option value="1">直接返信まで</option><option value="2">2段階先まで</option></select></div>
   <div class="filter-row"><strong>データ状態</strong><div class="legend" id="status-filters"></div></div>
   <div class="filter-note">同じ欄の複数条件はOR、異なる欄どうしはANDで適用します。</div><div class="chips" id="filter-summary"></div>
  </div><div class="graph-window" id="graph-window"><div class="graph-canvas" id="graph-canvas"><svg id="edges"></svg><div id="nodes"></div></div></div></section>
  <aside class="side">
   <section class="panel hidden" id="asr-pair-panel"><div class="panel-head"><h2>ASR 親子ペア</h2><small id="asr-pair-count"></small></div><div class="pair-list" id="asr-pair-list"></div></section>
   <section class="panel"><div class="panel-head"><h2>発話</h2><small id="comment-count"></small></div><div class="scroll" id="comment-list"></div></section>
   <section class="panel"><div class="panel-head"><h2>Topic Triple</h2><small>項目を選択して編集</small><button id="new-topic">＋追加</button></div><div class="scroll" id="topic-list"></div><form class="form hidden" id="topic-form"><input type="hidden" id="topic-id"><label>subject<input id="topic-subject" required></label><label>predicate<input id="topic-predicate" required></label><label>object<input id="topic-object" required></label><div class="form-row"><button type="submit">編集を反映</button><button type="button" class="danger" id="delete-topic">削除</button></div><p class="muted" id="topic-evidence-status"></p></form></section>
   <section class="panel"><div class="panel-head"><h2>関係</h2><small>一覧項目を選択して編集</small></div><div class="relations" id="relation-list"></div><form class="form" id="relation-form"><input type="hidden" id="relation-edit-id"><label>種類<select id="relation-kind"><option value="reply">発話 → 返信先発話</option><option value="comment_topic">発話 → Topic</option><option value="topic_topic">Topic → Topic</option><option value="comment_relation">発話 → Topic間関係</option></select></label><label>接続元<select id="relation-source"></select></label><label>接続先<select id="relation-target"></select></label><label>関係<select id="relation-label"></select></label><div class="form-row"><button type="submit" id="relation-submit">関係を追加</button><button type="button" id="relation-cancel" class="hidden">編集を中止</button></div></form></section>
  </aside>
  <section class="panel full"><div class="panel-head"><h2>選択項目と抽出根拠</h2></div><div class="evidence" id="detail"><p class="muted">発話またはTopicを選択してください。</p></div></section>
 </main><div class="notice hidden" id="notice"></div>
</template>

ているが、違いは、あなたたちが提案する解決策が論理や思いやりではなく、憎しみや誤った情報に基づいているということだ。もっと多くの人が座って耳を傾けてくれれば、私たちはそこにたどり着き、超党派の移民改革に実際に協力できると思う。","summary":"User_012 ITIN番号って聞いたことありますか？政府は不法滞在者がここに住んでいることを知っていて、彼らがいなくなったら経済が壊滅的な打撃を受けるほど経済を支えていることも","timestamp":null,"parent_comment_id":"comment_2b23801982","asr":[],"source_relation_label":"disagreement","source_pair_id":"pair_eecedc151d065fb9","source_stance_label":"2","linguistic":{"sentences":[{"index":0,"start":0,"end":28,"text":"User_012 ITIN番号って聞いたことありますか？"},{"index":1,"start":28,"end":97,"text":"政府は不法滞在者がここに住んでいることを知っていて、彼らがいなくなったら経済が壊滅的な打撃を受けるほど経済を支えていることも知っています。"},{"index":2,"start":97,"end":144,"text":"なぜ政府は彼らに独自の社会保障番号を与えるのに、運転免許証や保険を与えないのか教えてください。"},{"index":3,"start":144,"end":158,"text":"あなたの主張は保険料でした。"},{"index":4,"start":158,"end":191,"text":"この主張は不法滞在者にも米国市民にも利益にならないと思いませんか？"},{"index":5,"start":191,"end":209,"text":"しかし、保険会社には利益になります。"},{"index":6,"start":209,"end":225,"text":"不法滞在者は警察を恐れています。"},{"index":7,"start":225,"end":257,"text":"彼らがあなたの車にぶつかった瞬間、当然多くの人が逃げるでしょう。"},{"index":8,"start":257,"end":291,"text":"そのような小さな事故の違いは、彼らの人生が根こそぎ奪われることです。"},{"index":9,"start":291,"end":315,"text":"不法滞在者の大多数が運転しないのも同じ理由です。"},{"index":10,"start":315,"end":337,"text":"もし運転できるなら、彼らは運転するでしょう。"},{"index":11,"start":337,"end":369,"text":"なぜなら、それはあなたを守る以上に彼らを守ることになるからです。"},{"index":12,"start":369,"end":458,"text":"それ以上に、あなたも私も政府も、私たちの食料がどこから来ているのかを知っているし、あなたみたいな白人が100度を超える畑で糞を拾うなんてことは絶対にないってことはみんな知ってる。"},{"index":13,"start":458,"end":489,"text":"これは搾取と呼ばれ、資本主義を煽り、憎しみ、貪欲、恐怖を煽る。"},{"index":14,"start":489,"end":544,"text":"そして、それらすべてが共和党を煽り、あなたたちを彼らが望む場所でハムスターの回し車を回し続けるように仕向ける。"},{"index":15,"start":544,"end":596,"text":"もしあなたが周りを見渡して「これらの人々」の誰かに耳を傾け、彼らと会って彼らから学んでくれたらいいのに。"},{"index":16,"start":596,"end":693,"text":"国境は開放されるべきではない（そして実際開放されていない）という点では皆同意しているが、違いは、あなたたちが提案する解決策が論理や思いやりではなく、憎しみや誤った情報に基づいているということだ。"},{"index":17,"start":693,"end":748,"text":"もっと多くの人が座って耳を傾けてくれれば、私たちはそこにたどり着き、超党派の移民改革に実際に協力できると思う。"}],"morphemes":[{"id":9484,"morpheme_index  function renderDetail(){const box=$('detail');box.replaceChildren();if(!selected){box.append(make('p','muted','発話またはTopicを選択してください。'));return}if(selected.startsWith('comment:')){const c=state.comments.find(x=>x.comment_id===selected.slice(8));if(c){box.append(make('h3','',`Comment ${c.number} · ${c.author||'Unknown'}`),make('p','',c.content),make('small','muted',`ID: ${c.comment_id} / ASR: ${c.asr.join(', ')||'なし'}`));const linguistic=c.linguistic||{sentences:[],morphemes:[]};const sentences=make('article');sentences.append(make('h4','',`文解析（${linguistic.sentences.length}文）`));linguistic.sentences.forEach(s=>sentences.append(make('p','',`文${s.index}: ${s.text}`)));box.append(sentences);const table=make('table','morpheme-table'),head=make('thead'),hr=make('tr');['表層形','原形','正規化','品詞','品詞詳細','文','文節','Span'].forEach(x=>hr.append(make('th','',x)));head.append(hr);const body=make('tbody');linguistic.morphemes.forEach(m=>{const tr=make('tr');[m.surface,m.lemma||'',m.normalized||'',m.pos||'',m.pos_detail_1||'',m.sentence_index,m.bunsetsu_index,`${m.start_offset}:${m.end_offset}`].forEach(x=>tr.append(make('td','',x)));body.append(tr)});table.append(head,body);box.append(make('h4','',`形態素分析（${linguistic.morphemes.length}件）`),table)}return}if(selected.startsWith('topic:')){const t=state.topics.find(x=>x.id===selected.slice(6));if(!t)return;box.append(make('h3','',title(t)),make('p','muted','右側のTopic Triple編集フォームからsubject・predicate・objectを変更できます。'));if(t.evidence?.status==='missing'){box.append(make('p','muted','根拠情報なし'));return}box.append(make('p','muted',t.origin==='database'?'保存済みの抽出根拠です。Triple編集後は要確認です。':'新規Topicのため根拠は未設定です。'));(t.evidence?.blocks||[]).forEach(block=>{const article=make('article');article.append(make('h4','',`Comment ${block.number} · ${block.author||'Unknown'}`));block.sentences.forEach(s=>article.append(make('p','',s.text)));const tokens=make('div','tokens');block.morphemes.forEach(m=>{const roles=(m.matches||[]).map(x=>x.role);tokens.append(make('span',`token ${roles[0]||''}`,m.surface))});article.append(tokens);box.append(article)})}}
 function openTopic(id){const t=state.topics.find(x=>x.id===id);if(!t)return;const f=$('topic-form');f.classList.remove('hidden');$('topic-id').value=t.id;$('topic-subject').value=t.subject;$('topic-predicate').value=t.predicate;$('topic-object').value=t.object;$('topic-evidence-status').textContent=t.evidence?.status==='missing'?'根拠情報なし':'編集すると保存済み根拠は要確認になります。';$('delete-topic').classList.remove('hidden')}
 function updateRelationForm(){const kind=$('relation-kind').value,source=$('relation-source'),target=$('relation-target'),label=$('relation-label');source.replaceChildren();target.replaceChildren();label.replaceChildren();const add=(select,value,text)=>{const o=make('option','',text);o.value=value;select.append(o)};if(kind==='comment_topic'||kind==='comment_relation'||kind==='reply')state.comments.forEach(c=>add(source,c.comment_id,`Comment ${c.number}: ${c.comment_id}`));else state.topics.forEach(t=>add(source,t.id,t.external_topic_id));if(kind==='reply')state.comments.forEach(c=>add(target,c.comment_id,`Comment ${c.number}: ${c.comment_id}`));else if(kind==='comment_topic')state.topics.forEach(t=>add(target,t.id,t.external_topic_id));else if(kind==='topic_topic')state.topics.forEach(t=>add(target,t.id,t.external_topic_id));else state.relations.filter(r=>r.kind==='topic_topic').forEach(r=>add(target,r.id,relationTitle(r)));const allowed=kind==='topic_topic'?['causal','implicit']:kind==='reply'?['agreement','disagreement','reply']:['support','rebuttal','qualification'];allowed.forEach(x=>add(label,x,labels[x]))}
 function editRelation(id){const r=state.relations.find(x=>x.id===id);if(!r)return;$('relation-edit-id').value=id;$('relation-kind').value=r.kind;updateRelationForm();$('relation-source').value=r.source;$('relation-target').value=r.target;$('relation-label').value=r.label;$('relation-submit').textContent='関係を更新';$('relation-cancel').classList.remove('hidden')}
 function cancelRelationEdit(){$('relation-edit-id').value='';$('relation-submit').textContent='関係を追加';$('relation-cancel').classList.add('hidden');updateRelationForm()}
 function renderAll(){initHeader();renderLists();renderLegend();renderFilterSummary();renderAsrPairs();renderGraph();renderDetail();updateRelationForm()}
 function safeJson(value){return JSON.stringify(value).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026')}
 function buildDocument(value){const css=$('app-style').textContent,shell=$('app-shell').innerHTML,runtime='('+boot.toString()+')(JSON.parse(document.getElementById("discussion-data").textContent));';return '<!doctype html>\n<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JDA '+String(value.meta.discussion_id).replace(/[<>&]/g,'')+'</title><style id="app-style">'+css+'</style></head><body><template id="app-shell">'+shell+'</template><div id="app"></div><script id="discussion-data" type="application/json">'+safeJson(value)+'<'+ '/script><script>'+runtime+'<'+ '/script></body></html>'}
 $('save-html').onclick=()=>{const blob=new Blob([buildDocument(state)],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`discussion-${String(state.meta.discussion_id).replace(/[^0-9A-Za-z._-]+/g,'_')||'edited'}-edited.html`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);setDirty(false);notice('HTMLのダウンロードを開始しました')};
 $('new-topic').onclick=()=>{selected=null;const f=$('topic-form');f.classList.remove('hidden');$('topic-id').value='';$('topic-subject').value='';$('topic-predicate').value='';$('topic-object').value='';$('topic-evidence-status').textContent='新規Topicの根拠は未設定です。';$('delete-topic').classList.add('hidden')};
 $('topic-form').onsubmit=e=>{e.preventDefault();const id=$('topic-id').value;let t=state.topics.find(x=>x.id===id);if(!t){let n=1;while(state.topics.some(x=>x.id==='manual-'+n))n++;t={id:'manual-'+n,external_topic_id:'Manual '+n,origin:'manual',evidence:{status:'missing',blocks:[]}};state.topics.push(t)}t.subject=$('topic-subject').value;t.predicate=$('topic-predicate').value;t.object=$('topic-object').value;t.was_edited=true;selected='topic:'+t.id;setDirty();renderAll();openTopic(t.id)};
 $('delete-topic').onclick=()=>{const id=$('topic-id').value,t=state.topics.find(x=>x.id===id);if(!t)return;const affected=state.relations.filter(r=>r.source===id||r.target===id||((r.kind==='comment_relation')&&state.relations.find(x=>x.id===r.target&&(x.source===id||x.target===id))));if(!confirm(`「${title(t)}」と関連する${affected.length}件の関係を削除しますか？`))return;const relationIds=new Set(state.relations.filter(r=>r.kind==='topic_topic'&&(r.source===id||r.target===id)).map(r=>r.id));state.relations=state.relations.filter(r=>r.source!==id&&r.target!==id&&!relationIds.has(r.target));state.topics=state.topics.filter(x=>x.id!==id);selected=null;setDirty();$('topic-form').classList.add('hidden');renderAll()};
 $('relation-kind').onchange=updateRelationForm;$('relation-cancel').onclick=cancelRelationEdit;$('relation-form').onsubmit=e=>{e.preventDefault();const kind=$('relation-kind').value,source=$('relation-source').value,target=$('relation-target').value,label=$('relation-label').value,editId=$('relation-edit-id').value;if(!source||!target)return;if((kind==='topic_topic'||kind==='reply')&&source===target){notice('同じ項目同士は接続できません');return}if(editId){const r=state.relations.find(x=>x.id===editId);if(r)Object.assign(r,{kind,source,target,label,was_edited:true})}else{let n=Date.now().toString(36);while(state.relations.some(r=>r.id==='manual-relation-'+n))n+='x';state.relations.push({id:'manual-relation-'+n,kind,source,target,label,origin:'manual',was_edited:true})}setDirty();cancelRelationEdit();renderAll()};
 $('search-query').oninput=e=>{searchQuery=e.target.value.trim();selected=null;renderAll()};$('search-field').onchange=e=>{searchField=e.target.value;renderAll()};$('layer-preset').onchange=e=>{layerPreset=e.target.value;selected=null;renderAll()};$('filter-display').onchange=e=>{filterDisplay=e.target.value;renderAll()};$('sync-lists').onchange=e=>{syncLists=e.target.checked;renderAll()};$('user-scope').onchange=e=>{userScope=e.target.value;renderAll()};$('direction-filter').onchange=e=>{directionFilter=e.target.value;renderAll()};$('depth-filter').onchange=e=>{depthFilter=e.target.value;selected=null;renderAll()};
 $('zoom-in').onclick=()=>{scale=Math.min(1.8,scale+.12);applyTransform()};$('zoom-out').onclick=()=>{scale=Math.max(.25,scale-.12);applyTransform()};$('reset-view').onclick=()=>{scale=.72;pan={x:18,y:18};applyTransform()};$('clear-focus').onclick=()=>{selected=null;relationKeys.clear();asrKeys.clear();userKeys.clear();statusKeys.clear();searchQuery='';searchField='all';layerPreset='all';filterDisplay='hide';syncLists=true;userScope='author';directionFilter='both';depthFilter='all';$('search-query').value='';$('search-field').value=searchField;$('layer-preset').value=layerPreset;$('filter-display').value=filterDisplay;$('sync-lists').checked=syncLists;$('user-scope').value=userScope;$('direction-filter').value=directionFilter;$('depth-filter').value=depthFilter;$('topic-form').classList.add('hidden');renderAll()};
 const win=$('graph-window');win.onwheel=e=>{e.preventDefault();scale=Math.max(.25,Math.min(1.8,scale+(e.deltaY<0?.08:-.08)));applyTransform()};win.onpointerdown=e=>{if(e.target.closest('.node'))return;drag={x:e.clientX-pan.x,y:e.clientY-pan.y};win.setPointerCapture(e.pointerId)};win.onpointermove=e=>{if(drag){pan={x:e.clientX-drag.x,y:e.clientY-drag.y};applyTransform()}};win.onpointerup=()=>drag=null;
 renderAll();
}
boot(JSON.parse(document.getElementById('discussion-data').textContent));
