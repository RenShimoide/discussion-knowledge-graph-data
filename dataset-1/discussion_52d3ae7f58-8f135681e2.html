<template id="app-shell">
 <header class="top"><div class="logo"><strong>JDA</strong></div><h1 id="page-title"></h1><small>単一HTML・オフライン</small><span id="dirty" class="dirty"></span><button id="reset-view">全体表示</button><button id="save-html" class="primary">編集済みHTMLを保存</button></header>
 <section class="intro"><p id="meta"></p><p>公開元とDBは変更されません。編集内容は「編集済みHTMLを保存」で手元に残せます。</p><div class="stats" id="stats"></div></section>
 <main class="layout">
  <section class="panel"><div class="panel-head"><h2>Discussion / Topic 2層グラフ</h2><div class="toolbar"><button id="zoom-out">−</button><button id="zoom-in">＋</button><button id="clear-focus">絞り込み解除</button></div></div><div class="filters">
   <div class="filter-row"><strong>検索</strong><input class="filter-control search-input" id="search-query" type="search" placeholder="発話・Topic・ユーザーを検索"><select class="filter-control" id="search-field"><option value="all">すべて</option><option value="comment">発話本文</option><option value="user">ユーザー</option><option value="topic">Topic全体</option><option value="subject">subject</option><option value="predicate">predicate</option><option value="object">object</option></select></div>
   <div class="filter-row"><strong>表示</strong><select class="filter-control" id="layer-preset"><option value="all">全レイヤー</option><option value="reply">発話・返信</option><option value="comment_topic">発話→Topic</option><option value="topic">Topic間</option><option value="comments">発話のみ</option></select><select class="filter-control" id="filter-display"><option value="hide">条件外を非表示</option><option value="dim">条件外を薄く表示</option></select><label><input id="sync-lists" type="checkbox" checked> 一覧も連動</label></div>
   <div class="filter-row"><strong>ユーザー</strong><select class="filter-control" id="user-scope"><option value="author">発話者のみ</option><option value="pair">親子を含む</option></select><div class="legend" id="user-filters"></div></div>
   <div class="filter-row"><strong>Relation</strong><div class="legend" id="relation-filters"></div></div>
   <div class="filter-row"><strong>ASR</strong><div class="legend" id="asr-filters"></div></div>
   <div class="filter-row"><strong>方向</strong><select class="filter-control" id="direction-filter"><option value="both">入出力</option><option value="out">出ていく関係</option><option value="in">入ってくる関係</option></select><span class="muted">選択中の発話・Topicを基準</span><strong>返信深さ</strong><select class="filter-control" id="depth-filter"><option value="all">すべて</option><option value="0">ルートのみ</option><option value="1">直接返信まで</option><option value="2">2段階先まで</option></select></div>
   <div class="filter-row"><strong>データ状態</strong><div class="legend" id="status-filters"></div></div>
   <div class="filter-note">同じ欄の複数条件はOR、異なる欄どうしはANDで適用します。</div><div class="chips" id="filter-summary"></div>
  </div><div class="graph-window" id="graph-window"><div class="graph-canvas" id="graph-canvas"><svg id="edges"></svg><div id="nodes"></div></div></div></section>
  <aside class="side">
   <section class="panel hidden" id="asr-pair-panel"><div class="panel-head"><h2>ASR 親子ペア</h2><small id="asr-pair-count"></small></div><div class="pair-list" id="asr-pair-list"></div></section>
   <section class="panel"><div class="panel-head"><h2>発話</h2><small id="comment-count"></small></div><div class="scroll" id="comment-list"></div></section>
   <section class="panel"><div class="panel-head"><h2>Topic Triple</h2><small>項目を選択して編集</small><button id="new-topic">＋追加</button></div><div class="scroll" id="topic-list"></div><form class="form hidden" id="topic-form"><input type="hidden" id="topic-id"><label>subject<input id="topic-subject" required></label><label>predicate<input id="topic-predicate" required></label><label>object<input id="topic-object" required></label><div class="form-row"><button type="submit">編集を反映</button><button type="button" class="danger" id="delete-topic">削除</button></div><p class="muted" id="topic-evidence-status"></p></form></section>
   <section class="panel"><div class="panel-head"><h2>関係</h2><small>一覧項目を選択して編集</small></div><div class="relations" id="relation-list"></div><form class="form" id="relation-form"><input type="hidden" id="relation-edit-id"><label>種類<select id="relation-kind"><option value="reply">発話 → 返信先発話</option><option value="comment_topic">発話 → Topic</option><option value="topic_topic">Topic → Topic</option><option value="comment_relation">発話 → Topic間関係</option></select></label><label>接続元<select id="relation-source"></select></label><label>接続先<select id="relation-target"></select></label><label>関係<select id="relation-label"></select></label><div class="form-row"><button type="submit" id="relation-submit">関係を追加</button><button type="button" id="relation-cancel" class="hidden">編集を中止</button></div></form></section>
  </aside>
  <section class="panel full"><div class="panel-head"><h2>選択項目と抽出根拠</h2></div><div class="evidence" id="detail"><p class="muted">発話またはTopicを選択してください。</p></div></section>
 </main><div class="notice hidden" id="notice"></div>
</template>

。\n昔は私たち若い子たちとよくサッカーをしていた（当時私は15歳だった）。最初はスーパーで働き、その後は町のトルコパン屋兼カフェで働いていた。彼は以前はパン職人だったと言っていて、素晴らしいバクラヴァを作ることができた。彼は自活し、ドイツ語を学び、2017年にB1レベルに合格したばかりだった。\nそして彼は国外追放された。3年間も社会に溶け込もうと努力し、言葉を学び、必死に働いたのに、国外追放されたのだ。今でも理由は分からない。ただ単に、亡命が認められなかったからというだけだ。\nそして2年後、一時的な亡命を認められていたソマリア出身の移民が、バイエルン州の都市ヴュルツブルクの路上で数人を刺した。\n私の記憶が正しければ彼は撃たれたはずだが、その男は精神疾患を抱えていて、攻撃的で、以前にも何度か法律に触れるようなことをしていたことが知られていた。それなのに、なぜ彼には亡命が認められ、平和的で腕の良いパン職人は国外追放されたのだろうか？\nなぜあの殺人犯は、たとえもっと軽い犯罪だったとしても、初めて法律を破った時に国外追放されなかったのか？なのに、勤勉で誠実な人物は…\nおっしゃる通り、あまり賢いとは言えませんね…。","summary":"User_352 私はスウェーデン出身ではありませんが、私の国であるドイツでも同じようなことが起こっていると断言できます。両国は外国人難民に対する姿勢が非常に似ているので、その状況","timestamp":null,"parent_comment_id":"comment_83872ec8bf","asr":[],"source_relation_label":"agreement","source_pair_id":"pair_00f24f94ab3a45fb","source_stance_label":"2","linguistic":{"sentences":[{"index":0,"start":0,"end":8,"text":"User_352"},{"index":1,"start":9,"end":61,"text":"私はスウェーデン出身ではありませんが、私の国であるドイツでも同じようなことが起こっていると断言できます。"},{"index":2,"start":61,"end":100,"text":"両国は外国人難民に対する姿勢が非常に似ているので、その状況はよく想像できます。"},{"index":3,"start":100,"end":116,"text":"\nはい、私はそれを目撃しました。"},{"index":4,"start":116,"end":154,"text":"\n2015年、私たちの近所の難民キャンプに21歳のクルド人の男性がいました。"},{"index":5,"start":154,"end":183,"text":"彼はクールな人で、アレッポから逃げてきたと言っていました。"},{"index":6,"start":183,"end":209,"text":"\n昔は私たち若い子たちとよくサッカーをしていた（当時"},{"index":7,"start":209,"end":210,"text":"私"},{"index":8,"start":210,"end":211,"text":"は"},{"index":9,"start":211,"end":213,"text":"15"},{"index":10,"start":213,"end":214,"text":"歳"},{"index":11,"start":214,"end":216,"text":"だっ"},{"index":12,"start":216,"end":217,"text":"た"},{"index":13,"start":217,"end":218,"text":"）"},{"index":14,"start":218,"end":219,"text":"。"},{"index":15,"start":219,"end":252,"text":"最初はスーパーで働き、その後は町のトルコパン屋兼カフェで働いていた"},{"index":16,"start":252,"end":253,"text":"。"},{"index":17,"start":253,"end":292,"text":"彼は以前はパン職人だったと言っていて、素晴らしいバクラヴァを作ることができた。"},{"index":18,"start":292,"end":329,"text":"彼は自活し、ドイツ語を学び、2017年にB1レベルに合格したばかりだった。"},{"index":19,"s  function renderAsrPairs(){const panel=$('asr-pair-panel'),box=$('asr-pair-list');if(!asrKeys.size){panel.classList.add('hidden');box.replaceChildren();return}panel.classList.remove('hidden');const view=filterView(),pairs=state.relations.filter(r=>r.kind==='reply'&&(!view||view.edges.has(r.id))).map(r=>({r,child:state.comments.find(c=>c.comment_id===r.source),parent:state.comments.find(c=>c.comment_id===r.target)})).filter(x=>x.child&&x.parent&&x.child.asr.some(a=>asrKeys.has(a)));$('asr-pair-count').textContent=`${pairs.length}組`;box.replaceChildren();pairs.forEach(({r,child,parent})=>{const item=make('div','pair'),parentButton=make('button','',`親 Comment ${parent.number} · ${parent.author||'Unknown'}：${parent.summary||parent.content}`),arrow=make('div','arrow',`${child.asr.filter(a=>asrKeys.has(a)).join('・')} ↓`),childButton=make('button','',`子 Comment ${child.number} · ${child.author||'Unknown'}：${child.summary||child.content}`);parentButton.onclick=()=>select('comment:'+parent.comment_id);childButton.onclick=()=>select('comment:'+child.comment_id);item.append(parentButton,arrow,childButton);box.append(item)});if(!pairs.length)box.append(make('p','empty','現在の条件に一致する親子ペアはありません。'))}

 function renderDetail(){const box=$('detail');box.replaceChildren();if(!selected){box.append(make('p','muted','発話またはTopicを選択してください。'));return}if(selected.startsWith('comment:')){const c=state.comments.find(x=>x.comment_id===selected.slice(8));if(c){box.append(make('h3','',`Comment ${c.number} · ${c.author||'Unknown'}`),make('p','',c.content),make('small','muted',`ID: ${c.comment_id} / ASR: ${c.asr.join(', ')||'なし'}`));const linguistic=c.linguistic||{sentences:[],morphemes:[]};const sentences=make('article');sentences.append(make('h4','',`文解析（${linguistic.sentences.length}文）`));linguistic.sentences.forEach(s=>sentences.append(make('p','',`文${s.index}: ${s.text}`)));box.append(sentences);const table=make('table','morpheme-table'),head=make('thead'),hr=make('tr');['表層形','原形','正規化','品詞','品詞詳細','文','文節','Span'].forEach(x=>hr.append(make('th','',x)));head.append(hr);const body=make('tbody');linguistic.morphemes.forEach(m=>{const tr=make('tr');[m.surface,m.lemma||'',m.normalized||'',m.pos||'',m.pos_detail_1||'',m.sentence_index,m.bunsetsu_index,`${m.start_offset}:${m.end_offset}`].forEach(x=>tr.append(make('td','',x)));body.append(tr)});table.append(head,body);box.append(make('h4','',`形態素分析（${linguistic.morphemes.length}件）`),table)}return}if(selected.startsWith('topic:')){const t=state.topics.find(x=>x.id===selected.slice(6));if(!t)return;box.append(make('h3','',title(t)),make('p','muted','右側のTopic Triple編集フォームからsubject・predicate・objectを変更できます。'));if(t.evidence?.status==='missing'){box.append(make('p','muted','根拠情報なし'));return}box.append(make('p','muted',t.origin==='database'?'保存済みの抽出根拠です。Triple編集後は要確認です。':'新規Topicのため根拠は未設定です。'));(t.evidence?.blocks||[]).forEach(block=>{const article=make('article');article.append(make('h4','',`Comment ${block.number} · ${block.author||'Unknown'}`));block.sentences.forEach(s=>article.append(make('p','',s.text)));const tokens=make('div','tokens');block.morphemes.forEach(m=>{const roles=(m.matches||[]).map(x=>x.role);tokens.append(make('spa  function updateRelationForm(){const kind=$('relation-kind').value,source=$('relation-source'),target=$('relation-target'),label=$('relation-label');source.replaceChildren();target.replaceChildren();label.replaceChildren();const add=(select,value,text)=>{const o=make('option','',text);o.value=value;select.append(o)};if(kind==='comment_topic'||kind==='comment_relation'||kind==='reply')state.comments.forEach(c=>add(source,c.comment_id,`Comment ${c.number}: ${c.comment_id}`));else state.topics.forEach(t=>add(source,t.id,t.external_topic_id));if(kind==='reply')state.comments.forEach(c=>add(target,c.comment_id,`Comment ${c.number}: ${c.comment_id}`));else if(kind==='comment_topic')state.topics.forEach(t=>add(target,t.id,t.external_topic_id));else if(kind==='topic_topic')state.topics.forEach(t=>add(target,t.id,t.external_topic_id));else state.relations.filter(r=>r.kind==='topic_topic').forEach(r=>add(target,r.id,relationTitle(r)));const allowed=kind==='topic_topic'?['causal','implicit']:kind==='reply'?['agreement','disagreement','reply']:['support','rebuttal','qualification'];allowed.forEach(x=>add(label,x,labels[x]))}
