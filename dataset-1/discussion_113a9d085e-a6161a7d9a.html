<body>
<template id="app-shell">
 <header class="top"><div class="logo"><strong>JDA</strong></div><h1 id="page-title"></h1><small>単一HTML・オフライン</small><span id="dirty" class="dirty"></span><button id="reset-view">全体表示</button><button id="save-html" class="primary">編集済みHTMLを保存</button></header>
 <section class="intro"><p id="meta"></p><p>公開元とDBは変更されません。編集内容は「編集済みHTMLを保存」で手元に残せます。</p><div class="stats" id="stats"></div></section>
 <main class="layout">
  <section class="panel"><div class="panel-head"><h2>Discussion / Topic 2層グラフ</h2><div class="toolbar"><button id="zoom-out">−</button><button id="zoom-in">＋</button><button id="clear-focus">絞り込み解除</button></div></div><div class="filters">
   <div class="filter-row"><strong>検索</strong><input class="filter-control search-input" id="search-query" type="search" placeholder="発話・Topic・ユーザーを検索"><select class="filter-control" id="search-field"><option value="all">すべて</option><option value="comment">発話本文</option><option value="user">ユーザー</option><option value="topic">Topic全体</option><option value="subject">subject</option><option value="predicate">predicate</option><option value="object">object</option></select></div>
   <div class="filter-row"><strong>表示</strong><select class="filter-control" id="layer-preset"><option value="all">全レイヤー</option><option value="reply">発話・返信</option><option value="comment_topic">発話→Topic</option><option value="topic">Topic間</option><option value="comments">発話のみ</option></select><select class="filter-control" id="filter-display"><option value="hide">条件外を非表示</option><option value="dim">条件外を薄く表示</option></select><label><input id="sync-lists" type="checkbox" checked> 一覧も連動</label></div>
   <div class="filter-row"><strong>ユーザー</strong><select class="filter-control" id="user-scope"><option value="author">発話者のみ</option><option value="pair">親子を含む</option></select><div class="legend" id="user-filters"></div></div>
   <div class="filter-row"><strong>Relation</strong><div class="legend" id="relation-filters"></div></div>
   <div class="filter-row"><strong>ASR</strong><div class="legend" id="asr-filters"></div></div>
   <div class="filter-row"><strong>方向</strong><select class="filter-control" id="direction-filter"><option value="both">入出力</option><option value="out">出ていく関係</option><option value="in">入ってくる関係</option></select><span class="muted">選択中の発話・Topicを基準</span><strong>返信深さ</strong><select class="filter-control" id="depth-filter"><option value="all">すべて</option><option value="0">ルートのみ</option><option value="1">直接返信まで</option><option value="2">2段階先まで</option></select></div>
   <div class="filter-row"><strong>データ状態</strong><div class="legend" id="status-filters"></div></div>
   <div class="filter-note">同じ欄の複数条件はOR、異なる欄どうしはANDで適用します。</div><div class="chips" id="filter-summary"></div>
  </div><div class="graph-window" id="graph-window"><div class="graph-canvas" id="graph-canvas"><svg id="edges"></svg><div id="nodes"></div></div></div></section>
  <aside class="side">
   <section class="panel hidden" id="asr-pair-panel"><div class="panel-head"><h2>ASR 親子ペア</h2><small id="asr-pair-count"></small></div><div class="pair-list" id="asr-pair-list"></div></section>
   <section class="panel"><div class="panel-head"><h2>発話</h2><small id="comment-count"></small></div><div class="scroll" id="comment-list"></div></section>
   <section class="panel"><div class="panel-head"><h2>Topic Triple</h2><small>項目を選択して編集</small><button id="new-topic">＋追加</button></div><div class="scroll" id="topic-list"></div><form class="form hidden" id="topic-form"><input type="hidden" id="topic-id"><label>subject<input id="topic-subject" required></label><label>predicate<input id="topic-predicate" required></label><label>object<input id="topic-object" required></label><div class="form-row"><button type="submit">編集を反映</button><button type="button" class="danger" id="delete-topic">削除</button></div><p class="muted" id="topic-evidence-status"></p></form></section>
   <section class="panel"><div class="panel-head"><h2>関係</h2><small>一覧項目を選択して編集</small></div><div class="relations" id="relation-list"></div><form class="form" id="relation-form"><input type="hidden" id="relation-edit-id"><label>種類<select id="relation-kind"><option value="reply">発話 → 返信先発話</option><option value="comment_topic">発話 → Topic</option><option value="topic_topic">Topic → Topic</option><option value="comment_relation">発話 → Topic間関係</option></select></label><label>接続元<select id="relation-source"></select></label><label>接続先<select id="relation-target"></select></label><label>関係<select id="relation-label"></select></label><div class="form-row"><button type="submit" id="relation-submit">関係を追加</button><button type="button" id="relation-cancel" class="hidden">編集を中止</button></div></form></section>
  </aside>
  <section class="panel full"><div class="panel-head"><h2>選択項目と抽出根拠</h2></div><div class="evidence" id="detail"><p class="muted">発話またはTopicを選択してください。</p></div></section>
 </main><div class="notice hidden" id="notice"></div>
</template>

<script>
function boot(initialState){
 'use strict';
 const clone=value=>JSON.parse(JSON.stringify(value));
 let state=clone(initialState),dirty=false,selected=null,relationKeys=new Set(),asrKeys=new Set(),userKeys=new Set(),statusKeys=new Set(),searchQuery='',searchField='all',layerPreset='all',filterDisplay='hide',syncLists=true,userScope='author',directionFilter='both',depthFilter='all',scale=.72,pan={x:18,y:18},drag=null;

 function renderLists(){
  const view=filterView(),visibleNode=id=>!syncLists||!view||(view.listNodes||view.nodes).has(id),visibleEdge=id=>!syncLists||!view||view.edges.has(id);
  const commentRows=state.comments.filter(c=>visibleNode('comment:'+c.comment_id)),comments=$('comment-list');comments.replaceChildren();commentRows.forEach(c=>{const b=make('button',`item ${selected==='comment:'+c.comment_id?'active':''}`);b.append(make('small','',`Comment ${c.number} · ${c.author||'Unknown'}`),make('b','',c.summary||c.content));b.onclick=()=>select('comment:'+c.comment_id);comments.append(b)});if(!commentRows.length)comments.append(make('p','empty','該当する発話はありません。'));$('comment-count').textContent=`${commentRows.length}/${state.comments.length}件`;

 function layout(){
  const pos=new Map();const lanes=new Map();const childCounts=new Map();let nextLane=0;
  state.comments.forEach((c,index)=>{let lane=0;if(c.parent_comment_id){const n=childCounts.get(c.parent_comment_id)||0;childCounts.set(c.parent_comment_id,n+1);lane=n===0?(lanes.get(c.parent_comment_id)||0):++nextLane}lanes.set(c.comment_id,lane);pos.set('comment:'+c.comment_id,{x:55+index*285,y:65+lane*120})});

  state.relations.filter(r=>r.kind==='topic_topic').forEach((r,index)=>{const a=pos.get('topic:'+r.source),b=pos.get('topic:'+r.target);if(a&&b)pos.set('relation:'+r.id,{x:(a.x+b.x)/2+100,y:(a.y+b.y)/2+20+(index%2)*35})});
  return {pos,boundary,height:Math.max(900,boundary+300+Math.ceil(state.topics.length/5)*125)};
 }
 function endpoints(r){return [(r.kind==='comment_topic'||r.kind==='comment_relation'||r.kind==='reply'?'comment:':'topic:')+r.source,r.kind==='reply'?'comment:'+r.target:r.kind==='comment_topic'?'topic:'+r.target:r.kind==='topic_topic'?'topic:'+r.target:'relation:'+r.target]}
 function connectedSet(){if(!selected)return null;const nodes=new Set([selected]),edges=new Set();state.relations.forEach(r=>{const [a,b]=endpoints(r);if(a!==selected&&b!==selected)return;nodes.add(a);nodes.add(b);edges.add(r.id);if(r.kind==='comment_relation'){const base=state.relations.find(x=>x.id===r.target);if(base){nodes.add('topic:'+base.source);nodes.add('topic:'+base.target);edges.add(base.id)}}});return {nodes,edges}}
 function replyDepths(){const depths=new Map(),byParent=new Map();state.comments.forEach(c=>{if(c.parent_comment_id){if(!byParent.has(c.parent_comment_id))byParent.set(c.parent_comment_id,[]);byParent.get(c.parent_comment_id).push(c.comment_id)}});const visit=(id,depth)=>{if(depths.has(id)&&depths.get(id)<=depth)return;depths.set(id,depth);(byParent.get(id)||[]).forEach(child=>visit(child,depth+1))};state.comments.filter(c=>!c.parent_comment_id||!state.comments.some(x=>x.comment_id===c.parent_comment_id)).forEach(c=>visit(c.comment_id,0));state.comments.forEach(c=>{if(!depths.has(c.comment_id))visit(c.comment_id,0)});return depths}

 $('zoom-in').onclick=()=>{scale=Math.min(1.8,scale+.12);applyTransform()};$('zoom-out').onclick=()=>{scale=Math.max(.25,scale-.12);applyTransform()};$('reset-view').onclick=()=>{scale=.72;pan={x:18,y:18};applyTransform()};$('clear-focus').onclick=()=>{selected=null;relationKeys.clear();asrKeys.clear();userKeys.clear();statusKeys.clear();searchQuery='';searchField='all';layerPreset='all';filterDisplay='hide';syncLists=true;userScope='author';directionFilter='both';depthFilter='all';$('search-query').value='';$('search-field').value=searchField;$('layer-preset').value=layerPreset;$('filter-display').value=filterDisplay;$('sync-lists').checked=syncLists;$('user-scope').value=userScope;$('direction-filter').value=directionFilter;$('depth-filter').value=depthFilter;$('topic-form').classList.add('hidden');renderAll()};
 const win=$('graph-window');win.onwheel=e=>{e.preventDefault();scale=Math.max(.25,Math.min(1.8,scale+(e.deltaY<0?.08:-.08)));applyTransform()};win.onpointerdown=e=>{if(e.target.closest('.node'))return;drag={x:e.clientX-pan.x,y:e.clientY-pan.y};win.setPointerCapture(e.pointerId)};win.onpointermove=e=>{if(drag){pan={x:e.clientX-drag.x,y:e.clientY-drag.y};applyTransform()}};win.onpointerup=()=>drag=null;
 renderAll();
}
